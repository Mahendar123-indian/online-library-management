
name: LibraDesk CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Automated Testing

    runs-on: ubuntu-latest

    steps:
      # Step 1: Get project source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # Step 4: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 5: Install Selenium
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      # Step 6: Start the application
      - name: Start Library Application
        working-directory: backend
        run: |
          npm start > ../library.log 2>&1 &
          echo $! > ../library.pid

      # Step 7: Wait for application
      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat library.log
          exit 1

      # Step 8: Run Selenium Tests
      - name: Run Automated Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
