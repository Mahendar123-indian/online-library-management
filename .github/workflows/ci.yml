
name: LibraDesk CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Start Server and Run Selenium Tests
        run: |
          (cd backend && npm start) > library.log 2>&1 &
          SERVER_PID=$!

          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health; then
              echo "Library server is ready"
              break
            fi
            sleep 2
          done

          if ! curl -fsS http://localhost:3000/api/health; then
            echo "Server failed to start. Server logs:"
            cat library.log
            exit 1
          fi

          python -m unittest discover -s tests -p "test_*.py" -v

          TEST_STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_STATUS
